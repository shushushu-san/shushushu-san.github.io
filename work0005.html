        <h1 class="mb-3">東北大学一限マップ</h1>
        <p>
            平日の時刻表（JR・私鉄・地下鉄など約2,400本）をもとに、東北大学の1限（8:50開始）に間に合うよう、川内駅へ8:49までに到着できる駅を計算して地図にしました。全1,606駅が対象で、点の色は各駅の「最も遅い出発時刻」の帯（紫＝4時台まで、青＝5時台、緑系＝6時台、緑＝7時台、橙＝8時台）です。地図は表示範囲の切り替え、駅名検索、駅をタップしての詳細表示ができます。
        </p>
