<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSSI Monitor</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: sans-serif; margin: 16px; max-width: 800px; }
  canvas { width: 100%; height: 240px; border: 1px solid #ccc; }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
</style>
</head>
<body>
<h1>RSSI Monitor</h1>
<p id="status">読み込み中...</p>
<canvas id="c" width="800" height="240"></canvas>
<table id="t"></table>
<script>
async function load() {
  const res = await fetch('data/rssi.csv?t=' + Date.now());
  if (!res.ok) { document.getElementById('status').textContent = 'データがまだありません'; return; }
  const lines = (await res.text()).trim().split('\n').slice(1);
  const rows = lines.map(l => l.split(','));
  document.getElementById('status').textContent = rows.length + ' 件 / 最終: ' + rows[rows.length - 1][2];

  const vals = rows.map(r => Number(r[3]));
  const ctx = document.getElementById('c').getContext('2d');
  const W = 800, H = 240, min = -100, max = -20;
  ctx.clearRect(0, 0, W, H);
  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = vals.length > 1 ? i / (vals.length - 1) * W : 0;
    const y = H - (v - min) / (max - min) * H;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = '#06c'; ctx.stroke();

  const t = document.getElementById('t');
  t.innerHTML = '<tr><th>時刻</th><th>RSSI</th><th>AP数</th><th>最大RSSI</th></tr>' +
    rows.slice(-20).reverse().map(r => `<tr><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('');
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
